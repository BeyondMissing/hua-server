<section id="accounts-view" class="content-view">
    <div class="toolbar">
      <div class="title">
        <h2>账号管理</h2>
      </div>
      <div class="actions">
        <input id="search" class="search" placeholder="搜索 ID 或登录名">
        <button id="refresh" class="secondary">刷新</button>
        <button id="new-account" class="primary compact">新增账号</button>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>User ID</th>
            <th>登录名</th>
            <th>密码哈希</th>
            <th>角色</th>
            <th>封禁</th>
            <th>好友申请</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="account-rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">没有符合条件的账号。</div>
      <div class="pager">
        <span id="summary"></span>
        <div>
          <button id="prev">上一页</button>
          <button id="next">下一页</button>
        </div>
      </div>
    </div>
</section>
