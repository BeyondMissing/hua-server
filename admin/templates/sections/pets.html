<section id="pets-view" class="content-view hidden">
  <div class="toolbar">
    <div class="title"><h2>宠物管理</h2></div>
    <div class="actions">
      <input id="pet-user-id-filter" type="number" min="0" placeholder="User ID">
      <button id="pet-apply" class="secondary" type="button">筛选</button>
      <button id="pet-refresh" class="plain-button" type="button">刷新</button>
      <button id="pet-add" class="primary compact" type="button">添加宠物</button>
    </div>
  </div>
  <div class="panel">
    <div class="table-wrap">
      <table class="pets-table">
        <thead><tr><th>User ID</th><th>宠物类型</th><th>生日</th><th>成长点数</th><th>昵称</th><th>VIP</th><th>操作</th></tr></thead>
        <tbody id="pet-rows"></tbody>
      </table>
    </div>
    <div id="pet-empty" class="empty hidden">没有符合条件的宠物。</div>
    <div class="pager"><span id="pet-summary"></span><div class="pager-controls">
      <label for="pet-page-size">每页</label>
      <select id="pet-page-size"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select>
      <button id="pet-prev" type="button">上一页</button><button id="pet-next" type="button">下一页</button>
    </div></div>
  </div>
</section>
