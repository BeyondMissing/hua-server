<section id="flowers-view" class="content-view hidden">
  <div class="toolbar clothes-heading"><div class="title"><h2>花朵管理</h2></div>
    <form id="flowers-user-form" class="user-lookup"><label for="flowers-user-id">User ID</label><input id="flowers-user-id" type="number" min="1" max="4294967295" placeholder="输入玩家 User ID" required><button class="primary compact" type="submit">查询</button></form>
  </div>
  <div id="flowers-workspace" class="hidden"><div class="section-actions"><span id="flowers-owner" class="muted"></span><button id="new-flowers" class="primary compact" type="button">新增花朵</button></div>
    <div class="filter-bar inventory-filters"><div><label for="flowers-name">名称</label><input id="flowers-name" placeholder="按名称筛选"></div><button id="flowers-apply" class="secondary" type="button">筛选</button><button id="flowers-reset" class="plain-button" type="button">重置</button></div>
    <div class="panel"><div class="table-wrap"><table class="inventory-table"><thead><tr><th>Item ID</th><th>名称</th><th>数量</th><th>操作</th></tr></thead><tbody id="flowers-rows"></tbody></table></div><div id="flowers-empty" class="empty hidden">没有符合条件的花朵。</div><div class="pager"><span id="flowers-summary"></span><div class="pager-controls"><label for="flowers-page-size">每页</label><select id="flowers-page-size"><option value="10">10 条</option><option value="50">50 条</option><option value="100">100 条</option></select><button id="flowers-prev" type="button">上一页</button><button id="flowers-next" type="button">下一页</button></div></div></div>
  </div><div id="flowers-prompt" class="query-prompt">输入 User ID 查询该玩家的花朵。</div>
</section>
