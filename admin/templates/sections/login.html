<section id="login" class="login-wrap">
  <form id="login-form" class="login-card">
    <div class="eyebrow">Hua 2013 / Control Room</div>
    <h1>管理后台</h1>
    <label for="admin-user">管理员账号</label>
    <input id="admin-user" name="username" value="admin" autocomplete="username" required>
    <label for="admin-password">管理员密码</label>
    <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">登录后台</button>
    <div id="login-error" class="error"></div>
  </form>
</section>
