<section id="seeds-view" class="content-view hidden">
  <div class="toolbar clothes-heading"><div class="title"><h2>种子管理</h2></div>
    <form id="seeds-user-form" class="user-lookup"><label for="seeds-user-id">User ID</label><input id="seeds-user-id" type="number" min="1" max="4294967295" placeholder="输入玩家 User ID" required><button class="primary compact" type="submit">查询</button></form>
  </div>
  <div id="seeds-workspace" class="hidden"><div class="section-actions"><span id="seeds-owner" class="muted"></span><button id="new-seeds" class="primary compact" type="button">新增种子</button></div>
    <div class="filter-bar inventory-filters"><div><label for="seeds-name">名称</label><input id="seeds-name" placeholder="按名称筛选"></div><button id="seeds-apply" class="secondary" type="button">筛选</button><button id="seeds-reset" class="plain-button" type="button">重置</button></div>
    <div class="panel"><div class="table-wrap"><table class="inventory-table"><thead><tr><th>Item ID</th><th>名称</th><th>数量</th><th>操作</th></tr></thead><tbody id="seeds-rows"></tbody></table></div><div id="seeds-empty" class="empty hidden">没有符合条件的种子。</div><div class="pager"><span id="seeds-summary"></span><div class="pager-controls"><label for="seeds-page-size">每页</label><select id="seeds-page-size"><option value="10">10 条</option><option value="50">50 条</option><option value="100">100 条</option></select><button id="seeds-prev" type="button">上一页</button><button id="seeds-next" type="button">下一页</button></div></div></div>
  </div><div id="seeds-prompt" class="query-prompt">输入 User ID 查询该玩家的种子。</div>
</section>
